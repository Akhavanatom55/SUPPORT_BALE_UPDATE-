{% extends 'base.html' %}
{% block title %}تنظیمات{% endblock %}
{% block content %}<h1>تنظیمات</h1><section class="panel"><form method="post" class="stack"><label>PUBLIC_BASE_URL<input name="PUBLIC_BASE_URL" value="{{ values.PUBLIC_BASE_URL }}" placeholder="https://...belmo.io"></label><label>GROUP_CHAT_ID<input name="GROUP_CHAT_ID" value="{{ values.GROUP_CHAT_ID }}"></label><label>نام ربات<input name="BOT_NAME" value="{{ values.BOT_NAME }}"></label><label>نام مجموعه<input name="ORGANIZATION_NAME" value="{{ values.ORGANIZATION_NAME }}"></label><label>مدل Gemini<input name="GEMINI_MODEL" value="{{ values.GEMINI_MODEL }}"></label><label>AI_ENABLED<select name="AI_ENABLED"><option value="true" {% if values.AI_ENABLED in ['true','1','True'] %}selected{% endif %}>فعال</option><option value="false" {% if values.AI_ENABLED not in ['true','1','True'] %}selected{% endif %}>خاموش</option></select></label><label>پیام خوش‌آمد<textarea name="WELCOME_MESSAGE" rows="4">{{ values.WELCOME_MESSAGE }}</textarea></label><label>System Prompt<textarea name="GEMINI_SYSTEM_PROMPT" rows="8">{{ values.GEMINI_SYSTEM_PROMPT }}</textarea></label><button>ذخیره تنظیمات</button></form></section><section class="panel"><h2>Webhook</h2><p class="muted">URL: {{ values.PUBLIC_BASE_URL.rstrip('/') if values.PUBLIC_BASE_URL else request.url_root.rstrip('/') }}/api/bale/webhook/•••</p><div class="actions"><form method="post" action="{{ url_for('webhook_manage') }}"><input type="hidden" name="action" value="set"><button>ثبت / بروزرسانی وبهوک</button></form><form method="post" action="{{ url_for('webhook_manage') }}"><input type="hidden" name="action" value="delete"><button class="ghost">حذف وبهوک</button></form><a class="button ghost" href="{{ url_for('webhook_status') }}">وضعیت وبهوک (JSON)</a></div></section>{% endblock %}
